name: Tests

# The behaviour suite (pytest) and both design gates (plan_check, trace_check)
# run on every push and pull request, on both supported platforms. These are
# exactly the G-FULL commands EXEC-PLAN-001 §5.4 requires before every commit,
# so CI cannot drift from what contributors must run locally. The SRS/platform
# counterparts: TOOL-NFR-010 (Linux x86-64) and TOOL-NFR-020 / D-03 (Windows,
# whose pilot-first-or-Linux-first ordering is an open owner decision — this
# workflow runs both equally and ranks neither).
#
# Actions are pinned to the same major-version tags the existing
# traceability.yml workflow uses; that file is the house convention.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest + design gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the tool with its dev dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      # Behaviour suite. Must be green except for failures a task card or the
      # tracker's meta.tests block explicitly permits.
      - name: Run the behaviour test suite
        run: python -m pytest -q -p no:cacheprovider

      # Design gate 1: SRS <-> PLAN-001 §5.5 allocation, dependency closure,
      # derived-table drift (design/trace/plan_check.py).
      - name: Design gate - plan_check
        run: python design/trace/plan_check.py

      # Design gate 2: SRS <-> design register allocation and graph
      # well-formedness (design/trace/trace_check.py).
      - name: Design gate - trace_check
        run: python design/trace/trace_check.py
