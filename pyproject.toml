[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ectt"
version = "0.1.0"
description = "Embedded-C unit-test tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "libclang>=18.1,<19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "jsonschema>=4.20",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ectt.ana.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
